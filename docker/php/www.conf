; PERJODA — php-fpm pool (loaded as php-fpm.d/zz-www.conf, overrides the default pool)

[www]
user  = www-data
group = www-data

listen = 127.0.0.1:9000

pm = dynamic
pm.max_children      = 20
pm.start_servers     = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests      = 500

; IMPORTANT: keep the environment so Coolify-injected variables reach PHP.
clear_env = no

; Send worker stdout/stderr to the container log.
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null

; Recycle a worker if a request runs away. Matches php.ini max_execution_time
; so a large showcase-video upload isn't killed mid-request.
request_terminate_timeout = 300
