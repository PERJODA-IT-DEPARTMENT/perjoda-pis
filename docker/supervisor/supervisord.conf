; PERJODA — process supervisor for the runtime container.
; php-fpm + nginx are the web stack. The queue worker is present but OFF by
; default (the app dispatches no jobs today) — set autostart=true to enable it.

[supervisord]
nodaemon = true
user = root
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /run/supervisord.pid

[program:php-fpm]
command = php-fpm --nodaemonize --force-stderr
autostart = true
autorestart = true
priority = 10
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:nginx]
command = nginx -g "daemon off;"
autostart = true
autorestart = true
priority = 20
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:laravel-queue]
command = php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --no-interaction
user = www-data
autostart = false
autorestart = true
stopwaitsecs = 40
priority = 30
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
