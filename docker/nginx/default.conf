# PERJODA — Nginx (self-contained). Serves Laravel's public/ on port 80 and
# passes PHP to php-fpm on 127.0.0.1:9000. Coolify/Traefik terminates TLS in
# front of this container.

user  www-data;
worker_processes  auto;
pid  /run/nginx/nginx.pid;
error_log  /dev/stderr  warn;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /dev/stdout  main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    server_tokens      off;
    charset            utf-8;

    # Announcement image uploads are capped at 4 MB by the app; allow headroom.
    client_max_body_size  8m;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml application/xml+rss
                      image/svg+xml font/woff2;

    server {
        listen       80 default_server;
        listen       [::]:80 default_server;
        server_name  _;

        root   /var/www/html/public;
        index  index.php;

        # Hashed Vite assets — safe to cache hard.
        location /build/ {
            expires    1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files  $uri =404;
        }

        # User-uploaded files (storage:link -> storage/app/public).
        location /storage/ {
            expires    7d;
            add_header Cache-Control "public";
            access_log off;
            try_files  $uri =404;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /favicon.svg { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Everything else goes through Laravel's front controller.
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass  127.0.0.1:9000;
            fastcgi_index index.php;
            include       fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT   $realpath_root;
            fastcgi_hide_header X-Powered-By;
            fastcgi_read_timeout 60;
        }

        # Deny dotfiles (.env, .git, ...) except ACME well-known.
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
